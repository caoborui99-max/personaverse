<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人格管理 · PersonaVerse</title><link rel="stylesheet" href="./css/style.css"><style>body{max-width:760px;margin:auto;padding:24px}input,textarea,select,button{font:inherit;font-size:16px;padding:12px;margin:6px 0;max-width:100%;min-height:44px}input,textarea,select{display:block;width:100%;background:#191420;color:white;border:1px solid #594367;border-radius:6px}textarea{min-height:140px}article{border:1px solid #44314f;padding:16px;margin:12px 0;border-radius:10px}button{background:#af95ec;color:#171020;border-radius:6px;margin-right:8px}dialog{width:90%;max-width:650px}label{display:block}#notice{white-space:pre-wrap;color:#d6b9ed}header{display:flex;justify-content:space-between}h1{font-size:26px}</style><script defer src="./js/admin.js"></script><header><h1>人格管理</h1><a href="./index.html">返回首页</a></header><p id="notice" role="status"></p><form id="login"><label>管理员邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form><section id="panel" hidden><button id="new">新增人格</button><button id="logout">退出登录</button><div id="list"></div></section><dialog id="editor"><form id="form"><h2>编辑人格</h2><label>名称<input name="name" required maxlength="80"></label><label>简介<textarea name="description" required maxlength="2000"></textarea></label><label>分类<select name="categoryId" required></select></label><label>头像 HTTPS 地址<input name="avatarUrl" type="url"></label><label>系统提示词<textarea name="systemPrompt" required maxlength="20000"></textarea></label><label>状态<select name="status"><option value="draft">草稿</option><option value="published">已上架</option><option value="archived">已下架</option></select></label><button>保存</button><button type="button" id="cancel">取消</button></form></dialog></html>
