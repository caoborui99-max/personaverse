<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>人格对话 · PersonaVerse</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/demo.css">
  <script defer src="./js/demo.js"></script>
</head>
<body class="demo">
  <header><a href="./index.html">← 人格探索</a><h1 id="name">人格对话</h1></header>
  <p class="demo-note">正在检查聊天服务状态。只有发送消息时才会请求 AI；不会自动发送欢迎语或模拟回复。</p>
  <div id="messages" role="log" aria-live="polite"></div>
  <form id="composer">
    <label for="message">消息（最多1000字符）</label>
    <textarea id="message" maxlength="1000" required disabled placeholder="例如：我想练习英语"></textarea>
    <button id="send" class="button primary" disabled>正在检查…</button>
    <button type="button" class="button secondary" id="clear">新建会话</button>
  </form>
  <p id="error" role="status"></p>
  <p><a href="./admin.html">人格管理</a></p>
</body>
</html>
