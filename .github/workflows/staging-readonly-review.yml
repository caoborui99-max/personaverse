name: Staging readonly script validation
on:
  push:
    branches: ['fix/staging-check-readonly']
  pull_request:
    paths:
      - 'docs/reviews/staging-deploy/**'
      - '.github/workflows/staging-readonly-review.yml'
permissions:
  contents: read
jobs:
  readonly-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install namespace test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Diagnose proc namespace layouts (runner only)
        run: |
          sudo /usr/bin/python3 -I -B -S - <<'PYCASE'
          import subprocess
          layouts = {
            'fresh-proc': ['--proc','/proc','--remount-ro','/proc'],
            'empty-binfmt': ['--tmpfs','/proc/sys/fs/binfmt_misc','--remount-ro','/proc/sys/fs/binfmt_misc'],
            'bind-binfmt': ['--ro-bind','/proc/sys/fs/binfmt_misc','/proc/sys/fs/binfmt_misc'],
          }
          probe = 'import os; print("WRITABLE",[(x.split()[4],x.split()[5]) for x in open("/proc/self/mountinfo") if "ro" not in x.split()[5].split(",")]); print("NET",os.stat("/proc/self/ns/net").st_ino != os.stat("/proc/1/ns/net").st_ino)'
          for name, layout in layouts.items():
              r=subprocess.run(['bwrap','--ro-bind','/','/','--unshare-net','--die-with-parent',*layout,'--','/usr/bin/python3','-I','-B','-S','-c',probe],capture_output=True,text=True)
              print('LAYOUT',name,'EXIT',r.returncode,r.stdout,r.stderr,flush=True)
          PYCASE
      - name: Verify sealed namespace metadata (runner only)
        run: |
          sudo bwrap --ro-bind / / --unshare-net --die-with-parent --remount-ro /proc/sys/fs/binfmt_misc -- /usr/bin/python3 -I -B -S -c 'import os; writable=[(x.split()[4],x.split()[5]) for x in open("/proc/self/mountinfo") if "ro" not in x.split()[5].split(",")]; separate=os.stat("/proc/self/ns/net").st_ino != os.stat("/proc/1/ns/net").st_ino; print("WRITABLE_MOUNTS",writable); print("NET_SEPARATE",separate); assert not writable and separate'
      - name: Require real readonly boundary and compare fixture metadata
        working-directory: docs/reviews/staging-deploy
        run: sudo env PV_REQUIRE_READONLY_SANDBOX=1 /usr/bin/python3 -B -m unittest -v test_release.py test_readonly.py
      - name: Verify source checksums and build review artifact
        working-directory: docs/reviews/staging-deploy
        run: |
          sha256sum -c SHA256SUMS
          python3 -B - <<'PYZIP'
          import pathlib, zipfile, hashlib
          files = ['pv-staging-release.py','check-readonly.sh','README.md','READONLY-REVIEW.md','WORKFLOW-FAILURES.md','test_release.py','test_readonly.py','test-results.txt','SHA256SUMS']
          with zipfile.ZipFile('personaverse-staging-review.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files: z.write(name,name)
          path = pathlib.Path('personaverse-staging-review.zip')
          pathlib.Path('personaverse-staging-review.zip.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert all(z.read(n)==pathlib.Path(n).read_bytes() for n in files)
          PYZIP
      - uses: actions/upload-artifact@v4
        with:
          name: personaverse-readonly-review
          path: |
            docs/reviews/staging-deploy/personaverse-staging-review.zip
            docs/reviews/staging-deploy/personaverse-staging-review.zip.sha256
