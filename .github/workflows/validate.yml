name: PersonaVerse offline validation
on:
  push:
    branches: ['prepare/**', 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_ENABLED: 'false'
      AI_CHAT_ACCESS: admin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # SQLite fixtures need no external package, database URL, or API key.
      - run: npm test
      - run: npm run check:personas
      - run: npm run build
      - run: node scripts/check-preview.mjs --mirror
      - run: git diff --exit-code
      # Publication and migrations are deliberately absent. Enable deployment only after review.
  mobile-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
      PV_SCREENSHOT_DIR: /tmp/personaverse-mobile-review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-offline-fixture-review
          path: /tmp/personaverse-mobile-review/*.png
          if-no-files-found: warn
